<!DOCTYPE html>
<html>
  <head>
    <title>Würfel 3D</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
      body {
        margin: 0;
        background: #000;
        overflow: hidden;
      }
      model-viewer {
        width: 100vw;
        height: 100vh;
        display: block;
      }
    </style>
  </head>
  <body>
    <model-viewer
      src="wrfl.glb"
      auto-rotate
      camera-controls
      alt="3D Würfel"
      exposure="1"
      shadow-intensity="1"
      disable-zoom="false"
    ></model-viewer>
  </body>
</html>
